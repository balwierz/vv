# The Windows build shared by CI (windows.yml) and release.yml: MSYS2 UCRT64
# packages, vv + vvg, the staged install tree (packaging/windows/stage.sh),
# the WiX MSI (packaging/windows/vv.wxs) and the portable zip of the same
# tree, and a test of each as a user gets it — the MSI installed, the zip
# unzipped, both run with only C:\Windows on PATH (so a DLL missing from the
# package cannot be found elsewhere on the runner;
# packaging/windows/check-install.ps1), the MSI uninstalled.
name: Build vv for Windows and package the MSI and the zip
description: >
  MSYS2 UCRT64 build of vv and vvg (-DVV_BUILD_GUI=ON), the MSI and the
  portable zip, and a test of each.

outputs:
  msi:
    description: File name of the MSI, in the workspace root
    value: ${{ steps.msi.outputs.msi }}
  zip:
    description: File name of the portable zip, in the workspace root
    value: ${{ steps.zip.outputs.zip }}

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        path-type: inherit
        install: >-
          git
          diffutils
          zstd
        pacboy: >-
          toolchain:p cmake:p ninja:p pkgconf:p
          arrow:p htslib:p hdf5:p sqlite3:p xlsxio:p minizip:p expat:p
          zlib:p xz:p bzip2:p blosc:p qt6-base:p qt6-svg:p

    - name: Configure and build
      shell: msys2 {0}
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVV_BUILD_GUI=ON
        cmake --build build

    - name: Stage the install tree
      id: stage
      shell: msys2 {0}
      run: |
        packaging/windows/stage.sh build stage
        echo "version=$(./build/vv.exe --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Build the MSI (WiX v5)
      id: msi
      shell: pwsh
      run: |
        dotnet tool install --global wix --version 5.0.2
        $v = '${{ steps.stage.outputs.version }}'
        $msi = "vv-$v-windows-x86_64.msi"
        wix build packaging/windows/vv.wxs -arch x64 -d "Version=$v" -d "StageDir=$PWD\stage" -o $msi
        if ($LASTEXITCODE) { exit 1 }
        Get-Item $msi | Format-Table Name, Length
        "msi=$msi" >> $env:GITHUB_OUTPUT

    - name: Build the portable zip
      id: zip
      shell: pwsh
      run: |
        # The MSI's files under one folder named like the zip, with a README.
        $v = '${{ steps.stage.outputs.version }}'
        $name = "vv-$v-windows-x86_64"
        Copy-Item stage $name -Recurse
        Copy-Item packaging\windows\README-portable.txt "$name\README.txt"
        Compress-Archive -Path $name -DestinationPath "$name.zip" -CompressionLevel Optimal
        Remove-Item $name -Recurse
        Get-Item "$name.zip" | Format-Table Name, Length
        "zip=$name.zip" >> $env:GITHUB_OUTPUT

    - name: Run the portable zip, unzipped
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = '${{ steps.zip.outputs.zip }}'
        $to = Join-Path $env:RUNNER_TEMP 'portable'
        Expand-Archive $zip -DestinationPath $to -Force
        $dir = Join-Path $to ([IO.Path]::GetFileNameWithoutExtension($zip))
        if (-not (Test-Path "$dir\README.txt")) { throw 'README.txt missing from the zip' }
        & packaging\windows\check-install.ps1 -Dir $dir

    - name: Install, run and uninstall the MSI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $msi = "$PWD\${{ steps.msi.outputs.msi }}"
        function Msi($argv) {
          $p = Start-Process msiexec -ArgumentList $argv -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 60; throw "msiexec ${argv}: exit $($p.ExitCode)" }
        }
        Msi "/i `"$msi`" /qn /l*v msi.log"
        $dir = "$env:ProgramFiles\vv"
        # The system PATH gained the install directory.
        $syspath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
        if (-not ($syspath -match [regex]::Escape($dir))) { throw "install dir not on the system PATH: $syspath" }
        Write-Output 'ok  install dir on the system PATH'
        & packaging\windows\check-install.ps1 -Dir $dir
        Msi "/x `"$msi`" /qn /l*v msi.log"
        if (Test-Path "$dir\vv.exe") { throw 'uninstall left vv.exe behind' }
        Write-Output 'ok  uninstall'
