# Thin wrapper over scripts/setup-linux-build-deps.sh — the distro packages,
# the Apache Arrow apt repository (with the libcurl4-openssl-dev /
# -gnutls-dev conflict patched out of the -dev packages), and libxlsxio
# built from source. The logic lives in the script so the Debian container
# builds (packaging/debian/build-gui-deb-in-container.sh) run the exact same
# commands as the Ubuntu runner jobs — one copy, no drift.
name: Set up Linux reader dependencies
description: >
  Distro packages + Apache Arrow apt repo + libxlsxio from source, as the
  shared-deps vv build needs them on Debian/Ubuntu.

runs:
  using: composite
  steps:
    - name: Install dependencies (+ libxlsxio from source)
      shell: bash
      run: bash scripts/setup-linux-build-deps.sh
