name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & test (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Ubuntu's `libhts-dev` hard-Depends on `libcurl4-gnutls-dev`,
          # but GitHub-hosted runners preinstall the openssl variant.
          # Apt declares gnutls-dev "not installable" until the conflict
          # is broken. Remove openssl-dev first, then install gnutls-dev.
          sudo apt-get remove -y libcurl4-openssl-dev || true
          sudo apt-get install -y -V libcurl4-gnutls-dev

          # Apache Arrow apt repo (matches the version on each Ubuntu base).
          sudo apt-get install -y -V ca-certificates lsb-release wget
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          # Note on packages:
          #   - `tabix` already provides bgzip; there's no separate
          #     `bgzip-tools` package on any Ubuntu.
          #   - `python3-pyarrow` was removed from Ubuntu 24.04's repos
          #     (and PEP 668 forbids `pip install pyarrow` directly).
          #     Use a per-job venv instead — pip works freely there.
          sudo apt-get install -y -V \
            cmake g++ libarrow-dev libparquet-dev \
            libhts-dev libncursesw5-dev pkg-config \
            python3 python3-venv python3-pip \
            python3-pysam tabix bcftools

      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''

      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses
      - name: Configure
        # Homebrew's `apache-arrow` formula installs to its own prefix
        # (`$(brew --prefix apache-arrow)` — typically /opt/homebrew/opt/…
        # on Apple Silicon, /usr/local/opt/… on Intel). CMake's
        # `find_package(Arrow)` doesn't pick this up automatically;
        # CMAKE_PREFIX_PATH points it at the right place.
        run: |
          ARROW_PREFIX="$(brew --prefix apache-arrow)"
          HTSLIB_PREFIX="$(brew --prefix htslib)"
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ARROW_PREFIX;$HTSLIB_PREFIX;$NCURSES_PREFIX"
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help
