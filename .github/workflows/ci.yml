name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & test (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v6

      # Distro packages + Apache Arrow apt repo + libxlsxio from source.
      # Shared with release.yml's vv-gui job — edit the action, not a copy.
      - name: Install dependencies
        uses: ./.github/actions/setup-linux-deps

      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow openpyxl odfpy anndata h5py scipy

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''

      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

      # ── ASan + UBSan sanitizer gate (24.04 only) ─────────────────────────
      # Rebuild with AddressSanitizer + UndefinedBehaviorSanitizer and re-run the
      # smoke suite. Catches the memory-safety class (OOB / use-after-free /
      # misaligned load) the binary-format parsers are prone to — e.g. the
      # LociSSD v4 DICT/ARENA decoder OOBs. `ARROW_DEFAULT_MEMORY_POOL=system`
      # routes Arrow buffers through the ASan-instrumented allocator so overflows
      # inside them are caught (mimalloc is built with MI_OVERRIDE=OFF, so it
      # doesn't hide redzones). vptr is disabled — it false-positives across the
      # Arrow shared-library boundary. LeakSanitizer is off (a short-lived CLI
      # legitimately leaves allocations for the OS to reclaim at exit).
      - name: Sanitizer build (ASan + UBSan)
        if: matrix.os == '24.04'
        run: |
          FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g -O1"
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j$(nproc)

      - name: Sanitizer smoke tests
        if: matrix.os == '24.04'
        env:
          VV: ${{ github.workspace }}/build-asan/vv
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          ARROW_DEFAULT_MEMORY_POOL: system
        run: tests/run_tests.sh

      # ── libFuzzer smoke over the binary parsers (24.04 only) ─────────────
      # Fuzz the LociSSD v4 codec decoder and the NumPy .npy parser + builders
      # directly under ASan+UBSan for a short, bounded time. A regression that
      # reintroduces an out-of-bounds read / overflow / misaligned load / null
      # memcpy fails here. Needs clang (libFuzzer). Deterministic seed; a clean
      # tree survives far more than this budget's iterations, so it is not flaky.
      - name: Fuzz smoke (decode_colblock + npy)
        if: matrix.os == '24.04'
        env:
          ARROW_DEFAULT_MEMORY_POOL: system
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          sudo apt-get install -y -V clang
          cmake -S . -B build-fuzz -DVV_BUILD_FUZZERS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-fuzz -j"$(nproc)" --target fuzz_colblock fuzz_npy
          ./build-fuzz/fuzz_colblock -max_total_time=40 -seed=1
          ./build-fuzz/fuzz_npy      -max_total_time=40 -seed=1

      # ── Qt6/KDE GUI (24.04 only) ─────────────────────────────────────────
      # Reuses the shared Arrow / htslib / hdf5 / sqlite / xlsxio stack
      # installed above. This is where the KF6 plugins (.so) actually link —
      # the static-libs CLI build can't (its archives aren't PIC), so the GUI
      # build is validated here on shared deps.
      - name: Install GUI dependencies (Qt6; KF6 if available)
        if: matrix.os == '24.04'
        id: gui_deps
        run: |
          # Qt6 + ECM are all the Qt GUI (vvg) and the KF6-free plugin cores
          # (vvkde_core / vvkdetest) need, and are always in the 24.04 archive.
          sudo apt-get install -y -V qt6-base-dev extra-cmake-modules
          # The KF6 dev packages (KIO / CoreAddons / FileMetaData) are NOT in
          # the Ubuntu 24.04 archive — they first appear in 24.10. CMake builds
          # the Dolphin thumbnailer / KFileMetaData .so plugins only when KF6
          # is found (find_package(... QUIET)) and otherwise skips them, so
          # install KF6 best-effort and record whether it succeeded.
          if sudo apt-get install -y -V \
               libkf6kio-dev libkf6coreaddons-dev libkf6filemetadata-dev; then
            echo "kf6=yes" >> "$GITHUB_OUTPUT"
          else
            echo "kf6=no" >> "$GITHUB_OUTPUT"
            echo "::notice::KF6 dev packages unavailable on this runner; building the Qt GUI without the Dolphin/KFileMetaData plugins."
          fi

      - name: Build GUI (+ KDE plugins when KF6 present)
        if: matrix.os == '24.04'
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DVV_BUILD_GUI=ON
          cmake --build build-gui -j$(nproc)

      - name: Verify GUI artifacts
        if: matrix.os == '24.04'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # vvg and the headless plugin-core harness build with just Qt6 — they
          # exercise libvvcore end to end and need no KF6.
          test -x build-gui/gui/vvg
          # Headless payload check: render a thumbnail + probe metadata.
          ./build-gui/gui/kde/vvkdetest tests/data/tiny.parquet
          # Crash-safety: a malformed file must be handled gracefully (empty
          # result, exit 0) rather than aborting the Dolphin/Baloo worker.
          ./build-gui/gui/kde/vvkdetest --allow-empty tests/data/tiny.malformed.npz
          # Model path end-to-end through libvvcore.
          VVG_SELFTEST=1 ./build-gui/gui/vvg tests/data/tiny.parquet
          # App-shell path: build the QMainWindow offscreen and open a file via
          # the same addSourceTab/loadSources path the menus and drag-drop use.
          test "$(VVG_WINTEST=1 ./build-gui/gui/vvg tests/data/tiny.parquet)" = "win_tabs=1"
          # Region re-open (tabix): chr1:1099-1200 overlaps exactly one BED row.
          VVG_WINTEST=1 VVG_REGION=chr1:1099-1200 ./build-gui/gui/vvg tests/data/tiny.bed.gz \
            | grep -q 'rows=1'
          # Region re-open (generic Parquet): the rowCount must be the exact
          # post-filter count (3), not the pre-filter slice size — i.e. no
          # phantom trailing blank rows in the GUI.
          VVG_WINTEST=1 VVG_REGION=chr1:0-3000 ./build-gui/gui/vvg tests/data/tiny.parquet \
            | grep -q 'rows=3'
          # Background (off-UI-thread) filter returns the same rows as the CLI.
          VVG_WINTEST=1 VVG_AFILTER='Score > 0.2' ./build-gui/gui/vvg tests/data/tiny.parquet \
            | grep -q 'afilter .* rows=16'
          # Background (off-UI-thread) find returns the same match count as a
          # full per-cell scan ("chr1" matches 12 displayed cells; the Arrow
          # match_substring prefilter must not drop any).
          VVG_WINTEST=1 VVG_AFIND='chr1' ./build-gui/gui/vvg tests/data/tiny.parquet \
            | grep -q 'afind .* matches=12'
          # A dense AnnData X wider than the preview cap must materialise as a
          # 200-column preview (not the full 250), so a huge dense matrix can't
          # OOM the reader. The sibling X tab is only materialised by the GUI.
          # cols=201 = the 200 capped gene (var) columns + the prepended obs
          # (cell) row-label column; the footer still reports the 200-of-250
          # value-column cap.
          if [ -f tests/data/tiny.dense.h5ad ]; then
            VVG_WINTEST=1 VVG_TABDIMS=1 ./build-gui/gui/vvg tests/data/tiny.dense.h5ad \
              | grep -qE "tab 'X' rows=3 cols=201 .*first 200 of 250 cols"
          fi
          if [ "${{ steps.gui_deps.outputs.kf6 }}" = "yes" ]; then
            # KF6 present: the Dolphin thumbnailer + KFileMetaData .so plugins
            # must have linked against libvvcore.
            test -f build-gui/gui/kde/vvthumbnail.so
            test -f build-gui/gui/kde/vvextractor.so
          else
            echo "Skipping KF6 .so plugin checks (KF6 not installed)."
          fi

      # ── vv-gui Debian package (24.04 only) ───────────────────────────────
      # release.yml ships this .deb from a job that would otherwise first run
      # on a tag — the exact "the one configuration CI never exercises" trap
      # the ncurses probe comment in CMakeLists.txt documents. Build the same
      # package here on every push, and prove it installs and runs from the
      # distro archive alone by testing it in a pristine ubuntu:24.04
      # container (no Apache Arrow repo, no /usr/local xlsxio).
      - name: Build vv-gui deb
        if: matrix.os == '24.04'
        run: |
          sudo apt-get install -y -V patchelf
          bash packaging/debian/build-gui-deb.sh build-gui .

      - name: Install-test vv-gui deb in a pristine container
        if: matrix.os == '24.04'
        run: |
          deb="$(ls vv-gui_*.deb)"
          docker run --rm -v "$PWD:/mnt" ubuntu:24.04 \
            bash /mnt/packaging/debian/test-gui-deb.sh "/mnt/$deb" /mnt/tests/data/tiny.parquet

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses xlsxio expat minizip hdf5 qt
      - name: Configure
        # Homebrew's `apache-arrow` formula installs to its own prefix
        # (`$(brew --prefix apache-arrow)` — typically /opt/homebrew/opt/…
        # on Apple Silicon, /usr/local/opt/… on Intel). CMake's
        # `find_package(Arrow)` doesn't pick this up automatically;
        # CMAKE_PREFIX_PATH points it at the right place.
        #
        # VV_BUILD_GUI=ON in the same build dir (unlike Linux's separate
        # build-gui) so main.cpp compiles once for vv and once for vvcore,
        # not four times: the macOS release tarball ships vvg next to vv,
        # and this is where that configuration gets exercised.
        run: |
          ARROW_PREFIX="$(brew --prefix apache-arrow)"
          HTSLIB_PREFIX="$(brew --prefix htslib)"
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          XLSXIO_PREFIX="$(brew --prefix xlsxio)"
          EXPAT_PREFIX="$(brew --prefix expat)"
          MINIZIP_PREFIX="$(brew --prefix minizip)"
          HDF5_PREFIX="$(brew --prefix hdf5)"
          QT_PREFIX="$(brew --prefix qt)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVV_BUILD_GUI=ON \
            -DCMAKE_PREFIX_PATH="$ARROW_PREFIX;$HTSLIB_PREFIX;$NCURSES_PREFIX;$XLSXIO_PREFIX;$EXPAT_PREFIX;$MINIZIP_PREFIX;$HDF5_PREFIX;$QT_PREFIX"
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help
      # The suite ran on Linux only for 15+ releases, so "Build (macOS)" green
      # meant "it compiles and prints its help" — not one reader was ever
      # exercised on macOS. These two steps mirror the Linux job.
      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow openpyxl odfpy anndata h5py scipy
      - name: Install fixture tools
        # bgzip/tabix come with brew's htslib (already installed above);
        # bcftools is separate. samtools and tmux unlock ~10 further tests
        # (the BAM/CRAM region and pileup cross-checks, and one TUI check) —
        # without them those blocks skip themselves and macOS silently covers
        # less than Linux. coreutils provides gtimeout.
        # Still skipped on macOS: the UCSC bigBed/bigWig tools (absent; the
        # fixtures are shutil.which-gated in generate.py) and the ORC tests
        # (Homebrew's apache-arrow is built without the ORC adapter, which vv
        # reports honestly and the tests gate on).
        run: brew install bcftools coreutils samtools tmux
      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''
      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      # Mirrors the Linux "Verify GUI artifacts" step minus the KF6 .so
      # checks (the KF6 plugins are freedesktop/Linux-only; gui/kde/CMakeLists
      # never builds them on macOS). Same offscreen end-to-end coverage, so
      # the GUI cannot silently rot on the platform that ships it in the
      # release tarball.
      - name: Verify GUI artifacts (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          test -x build/gui/vvg
          ./build/gui/kde/vvkdetest tests/data/tiny.parquet
          ./build/gui/kde/vvkdetest --allow-empty tests/data/tiny.malformed.npz
          VVG_SELFTEST=1 ./build/gui/vvg tests/data/tiny.parquet
          test "$(VVG_WINTEST=1 ./build/gui/vvg tests/data/tiny.parquet)" = "win_tabs=1"
          VVG_WINTEST=1 VVG_REGION=chr1:1099-1200 ./build/gui/vvg tests/data/tiny.bed.gz \
            | grep -q 'rows=1'
          VVG_WINTEST=1 VVG_REGION=chr1:0-3000 ./build/gui/vvg tests/data/tiny.parquet \
            | grep -q 'rows=3'
          VVG_WINTEST=1 VVG_AFILTER='Score > 0.2' ./build/gui/vvg tests/data/tiny.parquet \
            | grep -q 'afilter .* rows=16'
          VVG_WINTEST=1 VVG_AFIND='chr1' ./build/gui/vvg tests/data/tiny.parquet \
            | grep -q 'afind .* matches=12'
          if [ -f tests/data/tiny.dense.h5ad ]; then
            VVG_WINTEST=1 VVG_TABDIMS=1 ./build/gui/vvg tests/data/tiny.dense.h5ad \
              | grep -qE "tab 'X' rows=3 cols=201 .*first 200 of 250 cols"
          fi
