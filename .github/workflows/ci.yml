name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & test (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Dependency tangle:
          #   libhts-dev hard-Depends on libcurl4-gnutls-dev
          #   Apache Arrow apt repo's libarrow-dev hard-Depends on
          #     `libcurl4-openssl-dev | libcurl-dev` — but apt-get's
          #     resolver won't take the `libcurl-dev` alternative when
          #     the primary is uninstallable due to a file conflict.
          # Solution: use Ubuntu's stock libarrow-dev from universe.
          # Both 22.04 (Arrow 9.0) and 24.04 (Arrow 16.1) ship it; it
          # was built against libcurl4-gnutls-dev (same as libhts-dev),
          # so the two coexist. vv's tests don't exercise APIs from
          # newer Arrow versions.
          sudo add-apt-repository -y universe
          sudo apt-get update
          # Diagnostic: confirm libarrow-dev is visible to apt before
          # the install (so if it disappears, the failure is obvious).
          apt-cache policy libarrow-dev libparquet-dev libhts-dev

          # `tabix` already provides bgzip — no separate `bgzip-tools`
          # package. `python3-pyarrow` was dropped from Ubuntu 24.04
          # (and PEP 668 blocks `pip install` against system Python) —
          # installed into a per-job venv in the next step.
          sudo apt-get install -y -V \
            cmake g++ libarrow-dev libparquet-dev \
            libhts-dev libncursesw5-dev libsqlite3-dev pkg-config \
            python3 python3-venv python3-pip \
            python3-pysam tabix bcftools

      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''

      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses
      - name: Configure
        # Homebrew's `apache-arrow` formula installs to its own prefix
        # (`$(brew --prefix apache-arrow)` — typically /opt/homebrew/opt/…
        # on Apple Silicon, /usr/local/opt/… on Intel). CMake's
        # `find_package(Arrow)` doesn't pick this up automatically;
        # CMAKE_PREFIX_PATH points it at the right place.
        run: |
          ARROW_PREFIX="$(brew --prefix apache-arrow)"
          HTSLIB_PREFIX="$(brew --prefix htslib)"
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ARROW_PREFIX;$HTSLIB_PREFIX;$NCURSES_PREFIX"
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help
