name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & test (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libcurl variant: libhts-dev hard-Depends on libcurl4-gnutls-dev.
          # GitHub-hosted runners preinstall libcurl4-openssl-dev, which
          # provides the same files — apt declares gnutls-dev "not
          # installable" until the openssl variant is removed.
          # The Apache Arrow apt repo's libarrow-dev *insists* on the
          # openssl variant, so we can't have both Arrow's apt repo and
          # libhts-dev. Solution: use Ubuntu's stock libarrow-dev from
          # universe — it's built against libcurl4-gnutls-dev (same as
          # libhts-dev), so the two coexist. Loses access to the very
          # latest Arrow (universe ships 7.x on 22.04, 16.x on 24.04),
          # but vv's CI smoke-tests don't need bleeding-edge APIs.
          sudo apt-get remove -y libcurl4-openssl-dev || true
          sudo apt-get install -y -V libcurl4-gnutls-dev

          # `tabix` already provides bgzip — no separate `bgzip-tools`
          # package on any Ubuntu. `python3-pyarrow` was dropped from
          # Ubuntu 24.04's repos (and PEP 668 blocks `pip install`
          # against the system Python) — installed into a per-job venv
          # in the next step.
          sudo apt-get install -y -V \
            cmake g++ libarrow-dev libparquet-dev \
            libhts-dev libncursesw5-dev libsqlite3-dev pkg-config \
            python3 python3-venv python3-pip \
            python3-pysam tabix bcftools

      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''

      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses
      - name: Configure
        # Homebrew's `apache-arrow` formula installs to its own prefix
        # (`$(brew --prefix apache-arrow)` — typically /opt/homebrew/opt/…
        # on Apple Silicon, /usr/local/opt/… on Intel). CMake's
        # `find_package(Arrow)` doesn't pick this up automatically;
        # CMAKE_PREFIX_PATH points it at the right place.
        run: |
          ARROW_PREFIX="$(brew --prefix apache-arrow)"
          HTSLIB_PREFIX="$(brew --prefix htslib)"
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ARROW_PREFIX;$HTSLIB_PREFIX;$NCURSES_PREFIX"
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help
