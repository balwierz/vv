name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build & test (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04", "22.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libhts-dev hard-Depends on libcurl4-gnutls-dev; runners
          # preinstall the openssl variant. Apache Arrow's libarrow-dev
          # Depends on `libcurl4-openssl-dev | libcurl-dev`. The gnutls
          # variant provides libcurl-dev and satisfies the alternative,
          # but `apt-get`'s resolver doesn't pick the alternative when
          # the named primary is "not installable". `aptitude` does.
          sudo apt-get install -y -V aptitude

          # Apache Arrow apt repo (matches the version on each Ubuntu base).
          sudo apt-get install -y -V ca-certificates lsb-release wget
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update

          # Pull the openssl→gnutls swap and the multi-source install in
          # one aptitude transaction so its resolver can see the full
          # picture (otherwise `apt-get install libcurl4-gnutls-dev`
          # leaves an awkward state where libarrow-dev's primary
          # `libcurl4-openssl-dev` isn't installable). `-y` and the
          # explicit `--without-recommends` keep it non-interactive.
          # `tabix` already provides bgzip; `python3-pyarrow` was
          # dropped from Ubuntu 24.04, installed into a venv below.
          sudo aptitude install -y --without-recommends \
            libcurl4-gnutls-dev \
            cmake g++ libarrow-dev libparquet-dev \
            libhts-dev libncursesw5-dev libsqlite3-dev pkg-config \
            python3 python3-venv python3-pip \
            python3-pysam tabix bcftools

      - name: Install pyarrow (venv)
        run: |
          python3 -m venv /tmp/vvpy
          /tmp/vvpy/bin/pip install --upgrade pip
          /tmp/vvpy/bin/pip install pyarrow

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Generate test fixtures
        run: /tmp/vvpy/bin/python tests/data/generate.py
        if: hashFiles('tests/data/generate.py') != ''

      - name: Smoke tests
        env:
          VV: ${{ github.workspace }}/build/vv
        run: tests/run_tests.sh
        if: hashFiles('tests/run_tests.sh') != ''

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses
      - name: Configure
        # Homebrew's `apache-arrow` formula installs to its own prefix
        # (`$(brew --prefix apache-arrow)` — typically /opt/homebrew/opt/…
        # on Apple Silicon, /usr/local/opt/… on Intel). CMake's
        # `find_package(Arrow)` doesn't pick this up automatically;
        # CMAKE_PREFIX_PATH points it at the right place.
        run: |
          ARROW_PREFIX="$(brew --prefix apache-arrow)"
          HTSLIB_PREFIX="$(brew --prefix htslib)"
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ARROW_PREFIX;$HTSLIB_PREFIX;$NCURSES_PREFIX"
      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help
