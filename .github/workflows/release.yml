name: Release

on:
  push:
    tags: ["v*"]

jobs:
  static-linux:
    name: Build static Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static binary in AlmaLinux 8
        run: |
          docker build --network=host -f Dockerfile.almalinux8 -t vv_build .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" vv_build

      - name: Verify binary
        run: |
          ./dist/vv --version
          ./dist/vv --help

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "vv-${version}-linux-x86_64"
          cp dist/vv "vv-${version}-linux-x86_64/"
          cp LICENSE README.md CHANGELOG.md "vv-${version}-linux-x86_64/"
          cp man/vv.1 "vv-${version}-linux-x86_64/" 2>/dev/null || true
          tar -czf "vv-${version}-linux-x86_64.tar.gz" "vv-${version}-linux-x86_64"
          sha256sum "vv-${version}-linux-x86_64.tar.gz" > SHA256SUMS

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## \[/ {
              if (printing) exit
              if ($0 ~ "\\["v"\\]") { printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${version}." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            vv-*-linux-x86_64.tar.gz
            SHA256SUMS
