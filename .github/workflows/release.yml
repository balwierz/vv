name: Release

on:
  push:
    tags: ["v*"]

jobs:
  static-linux:
    name: Build static Linux binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            # GitHub-hosted ARM64 runner for public repos. Builds natively on
            # ARM hardware — no QEMU emulation, no buildx --platform fiddling.
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache bundled source tarballs
        uses: actions/cache@v4
        with:
          path: docker-sources
          # The fetch script encodes every pinned version; hash it so a
          # dep bump invalidates the cache automatically.
          key: docker-sources-${{ hashFiles('scripts/fetch-docker-sources.sh') }}

      - name: Fetch bundled source tarballs
        # `docker-sources/` is gitignored to keep the repo lean; the
        # AlmaLinux 8 build needs ~58 MB of upstream tarballs. The fetch
        # script downloads each from its canonical upstream URL (pinned
        # versions). Skipped per-file when the cache hit above already
        # populated docker-sources/.
        run: bash scripts/fetch-docker-sources.sh

      - name: Build static binary in AlmaLinux 8
        run: |
          docker build --network=host -f Dockerfile.almalinux8 -t vv_build .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" vv_build

      - name: Verify binary
        run: |
          ./dist/vv --version
          ./dist/vv --help

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="vv-${version}-linux-${{ matrix.arch }}"
          mkdir -p "$stem"
          cp dist/vv "$stem/"
          cp LICENSE README.md CHANGELOG.md "$stem/"
          cp man/vv.1 "$stem/" 2>/dev/null || true
          tar -czf "$stem.tar.gz" "$stem"
          sha256sum "$stem.tar.gz" > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            vv-*-linux-${{ matrix.arch }}.tar.gz
            SHA256SUMS-${{ matrix.arch }}

  release:
    name: Publish GitHub Release
    needs: static-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Collect release files
        run: |
          mkdir -p release
          find dist-all -name 'vv-*-linux-*.tar.gz' -exec cp {} release/ \;
          # Merge per-arch SHA256SUMS into one file so the user can verify
          # any tarball with `sha256sum -c SHA256SUMS`.
          (cd release && find ../dist-all -name 'SHA256SUMS-*' \
              -exec cat {} \;) | sort -u > release/SHA256SUMS
          ls -lh release/

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## \[/ {
              if (printing) exit
              if ($0 ~ "\\["v"\\]") { printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${version}." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release/vv-*-linux-*.tar.gz
            release/SHA256SUMS
