name: Release

on:
  push:
    tags: ["v*"]

jobs:
  static-linux:
    name: Build static Linux binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            # GitHub-hosted ARM64 runner for public repos. Builds natively on
            # ARM hardware — no QEMU emulation, no buildx --platform fiddling.
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache bundled source tarballs
        uses: actions/cache@v5
        with:
          path: docker-sources
          # The fetch script encodes every pinned version; hash it so a
          # dep bump invalidates the cache automatically.
          key: docker-sources-${{ hashFiles('scripts/fetch-docker-sources.sh') }}

      - name: Fetch bundled source tarballs
        # `docker-sources/` is gitignored to keep the repo lean; the
        # AlmaLinux 8 build needs ~58 MB of upstream tarballs. The fetch
        # script downloads each from its canonical upstream URL (pinned
        # versions). Skipped per-file when the cache hit above already
        # populated docker-sources/.
        run: bash scripts/fetch-docker-sources.sh

      - name: Build static binary in AlmaLinux 8
        run: |
          docker build --network=host -f Dockerfile.almalinux8 -t vv_build .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" vv_build

      - name: Verify binary
        run: |
          ./dist/vv --version
          ./dist/vv --help

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="vv-${version}-linux-${{ matrix.arch }}"
          mkdir -p "$stem"
          cp dist/vv "$stem/"
          cp LICENSE CHANGELOG.md "$stem/"
          cp man/vv.1 "$stem/" 2>/dev/null || true
          cp INSTALL.md docs/USAGE.md "$stem/" 2>/dev/null || true
          # The repo README is written for GitHub: it links to files the
          # tarball does not carry and embeds screenshots from docs/img/,
          # which would render as broken images offline. Ship a short one
          # that points at the canonical copies instead.
          {
            echo "# vv ${version}"
            echo
            echo "Universal genomic file viewer — a single static binary."
            echo
            echo '```sh'
            echo "sudo install ${stem}/vv /usr/local/bin/"
            echo "vv --help"
            echo '```'
            echo
            echo "Also in this archive: \`vv.1\` (man page), \`INSTALL.md\`,"
            echo "\`USAGE.md\` (full manual), \`CHANGELOG.md\`, \`LICENSE\`."
            echo
            echo "Homepage and issue tracker: https://github.com/balwierz/vv"
          } > "$stem/README.md"
          tar -czf "$stem.tar.gz" "$stem"
          # Also wrap the same static binary in a .deb (the runner is Debian-
          # based, so dpkg-deb + the right `dpkg --print-architecture` are on
          # hand). Self-contained → Depends: libc6 only.
          bash packaging/debian/build-deb.sh dist/vv .
          deb="$(ls vv_*_*.deb)"
          sha256sum "$stem.tar.gz" "$deb" > "SHA256SUMS-${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            vv-*-linux-${{ matrix.arch }}.tar.gz
            vv_*_*.deb
            SHA256SUMS-${{ matrix.arch }}

  gui-linux:
    # The Qt6 GUI cannot ride in the static .deb above — it links the distro's
    # shared Qt6 — so it ships as its own per-distro package. Built exactly
    # like ci.yml's GUI leg (same composite action, same shared-deps config);
    # build-gui-deb.sh bundles the non-archive libs (Apache Arrow/Parquet,
    # xlsxio) under /usr/lib/vv-gui and computes the Depends, and the
    # pristine-container test proves the result installs and runs from the
    # Ubuntu archive alone. CI runs the same script on every push, so this
    # job is not a tag-only code path.
    name: Build vv-gui deb (Ubuntu 24.04, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install reader dependencies
        uses: ./.github/actions/setup-linux-deps

      - name: Install GUI dependencies (Qt6; KF6 if available)
        # Same best-effort KF6 rule as ci.yml: the KF6 dev packages first
        # appear in Ubuntu 25.10, so on 24.04 the build (and hence the .deb)
        # skips the Dolphin/KFileMetaData plugins. build-gui-deb.sh packages
        # them automatically the day the runner distro carries KF6.
        run: |
          sudo apt-get install -y -V qt6-base-dev extra-cmake-modules patchelf
          sudo apt-get install -y -V \
            libkf6kio-dev libkf6coreaddons-dev libkf6filemetadata-dev \
            || echo "::notice::KF6 dev packages unavailable; the .deb ships without the Dolphin/KFileMetaData plugins."

      - name: Build (VV_BUILD_GUI=ON)
        run: |
          cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DVV_BUILD_GUI=ON
          cmake --build build-gui -j$(nproc)

      - name: Smoke-test vvg (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          VVG_SELFTEST=1 ./build-gui/gui/vvg tests/data/tiny.parquet
          test "$(VVG_WINTEST=1 ./build-gui/gui/vvg tests/data/tiny.parquet)" = "win_tabs=1"

      - name: Build vv-gui deb
        run: |
          bash packaging/debian/build-gui-deb.sh build-gui .
          sha256sum vv-gui_*.deb > "SHA256SUMS-gui-${{ matrix.arch }}"

      - name: Install-test in a pristine container
        run: |
          deb="$(ls vv-gui_*.deb)"
          docker run --rm -v "$PWD:/mnt" ubuntu:24.04 \
            bash /mnt/packaging/debian/test-gui-deb.sh "/mnt/$deb" /mnt/tests/data/tiny.parquet

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gui-linux-${{ matrix.arch }}
          path: |
            vv-gui_*.deb
            SHA256SUMS-gui-${{ matrix.arch }}

  macos-arm64:
    name: Build macOS binary (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake apache-arrow htslib ncurses xlsxio expat minizip hdf5

      - name: Configure
        # Homebrew's ncurses is keg-only, and Arrow/xlsxio/... each live under
        # their own prefix, so every one has to be named explicitly. Missing
        # the ncurses entry silently resolves to Apple's 5.7 and fails the
        # ncurses>=6 check in CMakeLists.txt.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix apache-arrow);$(brew --prefix htslib);$(brew --prefix ncurses);$(brew --prefix xlsxio);$(brew --prefix expat);$(brew --prefix minizip);$(brew --prefix hdf5)"

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Sanity check
        run: |
          ./build/vv --version
          ./build/vv --help

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="vv-${version}-macos-arm64"
          mkdir -p "$stem"
          cp build/vv "$stem/"
          # `--strip-all` is GNU strip; macOS strip wants -S -x.
          strip -S -x "$stem/vv"
          cp LICENSE CHANGELOG.md "$stem/"
          cp man/vv.1 "$stem/" 2>/dev/null || true
          cp INSTALL.md docs/USAGE.md "$stem/" 2>/dev/null || true
          {
            echo "# vv ${version} (macOS arm64)"
            echo
            echo "Universal genomic file viewer."
            echo
            echo '```sh'
            echo "sudo install ${stem}/vv /usr/local/bin/"
            echo "vv --help"
            echo '```'
            echo
            echo "NOT a static binary: it links the Homebrew libraries it was"
            echo "built against. Install them with:"
            echo
            echo '```sh'
            echo "brew install apache-arrow htslib ncurses xlsxio expat minizip hdf5"
            echo '```'
            echo
            echo "Apple Silicon only. On an Intel Mac, build from source —"
            echo "see \`INSTALL.md\`."
            echo
            echo "Also in this archive: \`vv.1\` (man page), \`INSTALL.md\`,"
            echo "\`USAGE.md\` (full manual), \`CHANGELOG.md\`, \`LICENSE\`."
            echo
            echo "Homepage and issue tracker: https://github.com/balwierz/vv"
          } > "$stem/README.md"
          tar -czf "$stem.tar.gz" "$stem"
          shasum -a 256 "$stem.tar.gz" > "SHA256SUMS-macos-arm64"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            vv-*-macos-arm64.tar.gz
            SHA256SUMS-macos-arm64

  release:
    name: Publish GitHub Release
    needs: [static-linux, gui-linux, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        # Pinned to v7 (not v8): v8 defaults a download hash-mismatch to a hard
        # error and migrated to ESM. v7 already runs on Node 24, which is all we
        # need here.
        uses: actions/download-artifact@v7
        with:
          path: dist-all

      - name: Collect release files
        run: |
          mkdir -p release
          find dist-all -name 'vv-*-linux-*.tar.gz' -exec cp {} release/ \;
          find dist-all -name 'vv-*-macos-*.tar.gz' -exec cp {} release/ \;
          find dist-all -name 'vv_*_*.deb'          -exec cp {} release/ \;
          find dist-all -name 'vv-gui_*.deb'        -exec cp {} release/ \;
          # Merge per-arch SHA256SUMS into one file so the user can verify
          # any tarball or .deb with `sha256sum -c SHA256SUMS`.
          (cd release && find ../dist-all -name 'SHA256SUMS-*' \
              -exec cat {} \;) | sort -u > release/SHA256SUMS
          ls -lh release/

      - name: Extract changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## \[/ {
              if (printing) exit
              if ($0 ~ "\\["v"\\]") { printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${version}." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            release/vv-*-linux-*.tar.gz
            release/vv-*-macos-*.tar.gz
            release/vv_*_*.deb
            release/vv-gui_*.deb
            release/SHA256SUMS
